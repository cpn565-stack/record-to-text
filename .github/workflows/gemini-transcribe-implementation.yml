name: Gemini Transcribe Implementation

on:
  push:
    branches:
      - feature/gemini-3.5-transcribe
    paths:
      - scripts/apply-gemini-transcribe-phase*.py
      - .github/workflows/gemini-transcribe-implementation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-transcribe-implementation
  cancel-in-progress: false

jobs:
  implement:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gemini-3.5-transcribe
          fetch-depth: 0

      - name: Apply available implementation phases
        run: |
          set -euo pipefail
          for script in scripts/apply-gemini-transcribe-phase*.py; do
            if [ -f "$script" ]; then
              echo "Applying $script"
              python3 "$script"
            fi
          done

      - name: Install test tools
        run: brew install ffmpeg opencc

      - name: Build and run tests
        env:
          REQUIRE_XCTEST: "1"
        run: scripts/run-checks.sh

      - name: Commit generated implementation
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources Tests docs README.md CHANGELOG.md scripts 2>/dev/null || true
          git commit -m "refactor: persist dedicated cloud transcription semantics"
          git push origin HEAD:feature/gemini-3.5-transcribe
