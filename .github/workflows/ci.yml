name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install integration-test tools
        run: brew install ffmpeg opencc

      - name: Build and test
        env:
          REQUIRE_XCTEST: "1"
        run: scripts/run-checks.sh

      - name: Build unsigned App bundle
        env:
          ADHOC_SIGN: "0"
        run: scripts/build-app.sh

      - name: Verify functional App bundle contents
        env:
          ALLOW_UNSIGNED: "1"
          CHECK_APP_SIZE: "0"
        run: scripts/verify-release.sh dist/record-to-text.app
